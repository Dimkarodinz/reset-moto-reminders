          seed_key_derivation:
            knowledge_status: confirmed_for_captured_engine_ecu
            algorithm_family: unsigned_16_bit_multiply_modulo_2_16
            multiplier: "0x4B48"
            expression: "key = (seed * 0x4B48) mod 0x10000"
            seed_byte_order: big_endian
            key_byte_order: big_endian
            validated_pair_count: 6
            validated_pairs:
              - seed: "188B"
                key: "A018"
              - seed: "871C"
                key: "33E0"
              - seed: "FBBD"
                key: "2C28"
              - seed: "2A7B"
                key: "FB98"
              - seed: "7108"
                key: "2240"
              - seed: "89DE"
